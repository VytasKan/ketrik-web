<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <style>
      :root {
        --bg-left-start: #0a0e1a;
        --bg-left-end: #1a1f3a;
        --bg-right-start: #1a0a1a;
        --bg-right-end: #3a1528;
        
        --text-title-left: #8aa4c8;
        --text-sub-left: #5a7090;
        --grid-line: #2a3a5a;
        --grid-node: #4a6a9a;
        --divider-line: #333333;
        
        --text-title-right: #ff9e4a;
        --text-sub-right: #b08060;
        --text-quote: #cccccc;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg-left-start: #f1f5f9;
          --bg-left-end: #e2e8f0;
          --bg-right-start: #fff7ed;
          --bg-right-end: #ffedd5;
          
          --text-title-left: #1e3a8a;
          --text-sub-left: #475569;
          --grid-line: #cbd5e1;
          --grid-node: #64748b;
          --divider-line: #cbd5e1;
          
          --text-title-right: #c2410c;
          --text-sub-right: #9a3412;
          --text-quote: #334155;
        }
      }

      [data-mui-color-scheme="light"] svg,
      .mui-mode-light svg,
      html[data-theme="light"] svg,
      body.light-mode svg {
        --bg-left-start: #f1f5f9;
        --bg-left-end: #e2e8f0;
        --bg-right-start: #fff7ed;
        --bg-right-end: #ffedd5;
        
        --text-title-left: #1e3a8a;
        --text-sub-left: #475569;
        --grid-line: #cbd5e1;
        --grid-node: #64748b;
        --divider-line: #cbd5e1;
        
        --text-title-right: #c2410c;
        --text-sub-right: #9a3412;
        --text-quote: #334155;
      }

      .bg-left-0 { stop-color: var(--bg-left-start); }
      .bg-left-100 { stop-color: var(--bg-left-end); }
      .bg-right-0 { stop-color: var(--bg-right-start); }
      .bg-right-100 { stop-color: var(--bg-right-end); }

      .text-title-left { fill: var(--text-title-left); }
      .text-sub-left { fill: var(--text-sub-left); }
      .grid-line { stroke: var(--grid-line); }
      .grid-node { fill: var(--grid-node); }
      .divider { stroke: var(--divider-line); }

      .text-title-right { fill: var(--text-title-right); }
      .text-sub-right { fill: var(--text-sub-right); }
      .text-quote { fill: var(--text-quote); }
    </style>

    <linearGradient id="bg-left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" class="bg-left-0"/>
      <stop offset="100%" class="bg-left-100"/>
    </linearGradient>
    <linearGradient id="bg-right" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" class="bg-right-0"/>
      <stop offset="100%" class="bg-right-100"/>
    </linearGradient>
    <radialGradient id="glow-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a9eff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4a9eff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-amber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9e4a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff9e4a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arrow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a9eff"/>
      <stop offset="100%" stop-color="#ff9e4a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-strong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background split -->
  <rect x="0" y="0" width="600" height="700" fill="url(#bg-left)"/>
  <rect x="600" y="0" width="600" height="700" fill="url(#bg-right)"/>

  <!-- Divider line -->
  <line x1="600" y1="80" x2="600" y2="650" class="divider" stroke-width="1" stroke-dasharray="8,8"/>

  <!-- LEFT SIDE: The Old World -->
  <text x="300" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" class="text-title-left" letter-spacing="2">THE OLD WORLD</text>
  <text x="300" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" class="text-sub-left">Human draws the map. System follows it.</text>

  <!-- Grid topology -->
  <g transform="translate(120, 140)">
    <text x="80" y="-15" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" class="text-sub-left" font-weight="600">GRID COMPUTING</text>
    <!-- Grid lines -->
    <line x1="0" y1="0" x2="160" y2="0" class="grid-line" stroke-width="1"/>
    <line x1="0" y1="40" x2="160" y2="40" class="grid-line" stroke-width="1"/>
    <line x1="0" y1="80" x2="160" y2="80" class="grid-line" stroke-width="1"/>
    <line x1="0" y1="120" x2="160" y2="120" class="grid-line" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="120" class="grid-line" stroke-width="1"/>
    <line x1="40" y1="0" x2="40" y2="120" class="grid-line" stroke-width="1"/>
    <line x1="80" y1="0" x2="80" y2="120" class="grid-line" stroke-width="1"/>
    <line x1="120" y1="0" x2="120" y2="120" class="grid-line" stroke-width="1"/>
    <line x1="160" y1="0" x2="160" y2="120" class="grid-line" stroke-width="1"/>
    <!-- Nodes -->
    <circle cx="20" cy="20" r="6" class="grid-node" opacity="0.8"/>
    <circle cx="60" cy="20" r="6" class="grid-node" opacity="0.8"/>
    <circle cx="100" cy="20" r="6" class="grid-node" opacity="0.8"/>
    <circle cx="140" cy="20" r="6" class="grid-node" opacity="0.8"/>
    <circle cx="20" cy="60" r="6" class="grid-node" opacity="0.8"/>
    <circle cx="60" cy="60" r="6" class="grid-node" opacity="0.8"/>
    <circle cx="100" cy="60" r="6" class="grid-node" opacity="0.8"/>
    <circle cx="140" cy="60" r="6" class="grid-node" opacity="0.8"/>
    <circle cx="20" cy="100" r="6" class="grid-node" opacity="0.8"/>
    <circle cx="60" cy="100" r="6" class="grid-node" opacity="0.8"/>
    <circle cx="100" cy="100" r="6" class="grid-node" opacity="0.8"/>
    <circle cx="140" cy="100" r="6" class="grid-node" opacity="0.8"/>
  </g>

  <!-- Star topology -->
  <g transform="translate(120, 340)">
    <text x="80" y="-15" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" class="text-sub-left" font-weight="600">MAPREDUCE</text>
    <circle cx="80" cy="60" r="10" fill="#4a9eff" filter="url(#glow)"/>
    <circle cx="20" cy="20" r="6" class="grid-node"/>
    <circle cx="140" cy="20" r="6" class="grid-node"/>
    <circle cx="20" cy="100" r="6" class="grid-node"/>
    <circle cx="140" cy="100" r="6" class="grid-node"/>
    <line x1="80" y1="60" x2="20" y2="20" stroke="#4a9eff" stroke-width="1.5" opacity="0.5"/>
    <line x1="80" y1="60" x2="140" y2="20" stroke="#4a9eff" stroke-width="1.5" opacity="0.5"/>
    <line x1="80" y1="60" x2="20" y2="100" stroke="#4a9eff" stroke-width="1.5" opacity="0.5"/>
    <line x1="80" y1="60" x2="140" y2="100" stroke="#4a9eff" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Circle/loop topology -->
  <g transform="translate(120, 520)">
    <text x="80" y="-15" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" class="text-sub-left" font-weight="600">AGENT LOOP</text>
    <ellipse cx="80" cy="60" rx="60" ry="50" fill="none" stroke="#4a9eff" stroke-width="2" opacity="0.4" stroke-dasharray="6,4"/>
    <circle cx="80" cy="15" r="8" fill="#4a9eff" filter="url(#glow)"/>
    <circle cx="125" cy="45" r="6" class="grid-node"/>
    <circle cx="110" cy="95" r="6" class="grid-node"/>
    <circle cx="50" cy="95" r="6" class="grid-node"/>
    <circle cx="35" cy="45" r="6" class="grid-node"/>
    <path d="M 80 23 L 120 42" stroke="#4a9eff" stroke-width="1.5" opacity="0.5"/>
    <path d="M 118 50 L 108 88" stroke="#4a9eff" stroke-width="1.5" opacity="0.5"/>
    <path d="M 100 95 L 58 95" stroke="#4a9eff" stroke-width="1.5" opacity="0.5"/>
    <path d="M 42 88 L 38 52" stroke="#4a9eff" stroke-width="1.5" opacity="0.5"/>
    <path d="M 42 38 L 72 22" stroke="#4a9eff" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- RIGHT SIDE: The New World -->
  <text x="900" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" class="text-title-right" letter-spacing="2">THE NEW WORLD</text>
  <text x="900" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" class="text-sub-right">Model computes the map. Topology is the output.</text>

  <!-- Neural network / emergent topology -->
  <g transform="translate(680, 120)">
    <!-- Background glow -->
    <ellipse cx="220" cy="220" rx="200" ry="180" fill="url(#glow-amber)" opacity="0.6"/>

    <!-- Organic nodes -->
    <circle cx="120" cy="80" r="8" fill="#ff9e4a" filter="url(#glow-strong)"/>
    <circle cx="280" cy="60" r="7" fill="#ff7e2a" filter="url(#glow)"/>
    <circle cx="340" cy="140" r="9" fill="#ff9e4a" filter="url(#glow-strong)"/>
    <circle cx="300" cy="240" r="7" fill="#ff7e2a" filter="url(#glow)"/>
    <circle cx="180" cy="300" r="8" fill="#ff9e4a" filter="url(#glow-strong)"/>
    <circle cx="80" cy="220" r="7" fill="#ff7e2a" filter="url(#glow)"/>
    <circle cx="160" cy="160" r="10" fill="#ffbe6a" filter="url(#glow-strong)"/>
    <circle cx="240" cy="180" r="8" fill="#ff9e4a" filter="url(#glow)"/>
    <circle cx="220" cy="100" r="6" fill="#ff7e2a" filter="url(#glow)"/>
    <circle cx="100" cy="140" r="7" fill="#ff9e4a" filter="url(#glow)"/>
    <circle cx="320" cy="200" r="6" fill="#ffbe6a" filter="url(#glow)"/>
    <circle cx="140" cy="240" r="7" fill="#ff7e2a" filter="url(#glow)"/>

    <!-- Organic connections -->
    <path d="M 120 80 Q 180 60 280 60" stroke="#ff9e4a" stroke-width="1.5" fill="none" opacity="0.6" filter="url(#glow)"/>
    <path d="M 280 60 Q 320 100 340 140" stroke="#ff9e4a" stroke-width="1.5" fill="none" opacity="0.6" filter="url(#glow)"/>
    <path d="M 340 140 Q 330 190 300 240" stroke="#ff9e4a" stroke-width="1.5" fill="none" opacity="0.6" filter="url(#glow)"/>
    <path d="M 300 240 Q 240 270 180 300" stroke="#ff9e4a" stroke-width="1.5" fill="none" opacity="0.6" filter="url(#glow)"/>
    <path d="M 180 300 Q 130 260 80 220" stroke="#ff9e4a" stroke-width="1.5" fill="none" opacity="0.6" filter="url(#glow)"/>
    <path d="M 80 220 Q 90 160 100 140" stroke="#ff9e4a" stroke-width="1.5" fill="none" opacity="0.6" filter="url(#glow)"/>
    <path d="M 160 160 Q 130 110 120 80" stroke="#ffbe6a" stroke-width="2" fill="none" opacity="0.8" filter="url(#glow)"/>
    <path d="M 160 160 Q 200 130 220 100" stroke="#ffbe6a" stroke-width="2" fill="none" opacity="0.8" filter="url(#glow)"/>
    <path d="M 160 160 Q 200 170 240 180" stroke="#ffbe6a" stroke-width="2" fill="none" opacity="0.8" filter="url(#glow)"/>
    <path d="M 240 180 Q 280 160 280 60" stroke="#ff9e4a" stroke-width="1.5" fill="none" opacity="0.6" filter="url(#glow)"/>
    <path d="M 240 180 Q 280 210 320 200" stroke="#ff9e4a" stroke-width="1.5" fill="none" opacity="0.6" filter="url(#glow)"/>
    <path d="M 100 140 Q 130 150 160 160" stroke="#ff9e4a" stroke-width="1.5" fill="none" opacity="0.6" filter="url(#glow)"/>
    <path d="M 140 240 Q 150 200 160 160" stroke="#ff9e4a" stroke-width="1.5" fill="none" opacity="0.6" filter="url(#glow)"/>
    <path d="M 220 100 Q 230 140 240 180" stroke="#ff9e4a" stroke-width="1.5" fill="none" opacity="0.6" filter="url(#glow)"/>

    <!-- Central orchestrator glow -->
    <circle cx="200" cy="170" r="25" fill="url(#glow-amber)" opacity="0.8"/>
    <circle cx="200" cy="170" r="8" fill="#ffbe6a" filter="url(#glow-strong)"/>
  </g>

  <!-- Transition arrow -->
  <g transform="translate(560, 350)">
    <path d="M 0 -30 L 80 0 L 0 30 Z" fill="url(#arrow-grad)" opacity="0.9" filter="url(#glow)"/>
    <text x="40" y="5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#fff">AI</text>
  </g>

  <!-- Labels on right -->
  <g transform="translate(720, 480)">
    <text x="220" y="0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffbe6a">KIMI AGENT SWARM</text>
    <text x="220" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" class="text-sub-right">Topology computed at runtime</text>
    <text x="220" y="45" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" class="text-sub-right">No blueprint. No menu. Just emergence.</text>
  </g>

  <!-- Bottom quote -->
  <text x="600" y="660" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" class="text-quote" font-style="italic">&quot;The state machine stopped being a graph.&quot;</text>
</svg>