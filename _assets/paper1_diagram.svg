<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2100 900" width="2100" height="900">
  <defs>
    <style>
      <![CDATA[
      /* Default / Dark Theme Colors */
      :root {
        --bg-left-start: #0a0e1a;
        --bg-left-end: #1a1f3a;
        --bg-right-start: #1a0a1a;
        --bg-right-end: #3a1528;
        
        --text-title-left: #8aa4c8;
        --text-sub-left: #5a7090;
        --grid-line: #2a3a5a;
        --grid-node: #4a6a9a;
        --divider-line: #333333;
        
        --text-title-right: #ff9e4a;
        --text-sub-right: #b08060;
        --text-quote: #cccccc;
      }

      /* MUI Light Mode and prefers-color-scheme: light */
      @media (prefers-color-scheme: light) {
        :root {
          --bg-left-start: #f1f5f9;
          --bg-left-end: #e2e8f0;
          --bg-right-start: #fff7ed;
          --bg-right-end: #ffedd5;
          
          --text-title-left: #1e3a8a;
          --text-sub-left: #475569;
          --grid-line: #cbd5e1;
          --grid-node: #64748b;
          --divider-line: #cbd5e1;
          
          --text-title-right: #c2410c;
          --text-sub-right: #9a3412;
          --text-quote: #334155;
        }
      }

      /* Explicit MUI Light Mode Selectors */
      [data-mui-color-scheme="light"] svg,
      .mui-mode-light svg,
      html[data-theme="light"] svg,
      body.light-mode svg {
        --bg-left-start: #f1f5f9;
        --bg-left-end: #e2e8f0;
        --bg-right-start: #fff7ed;
        --bg-right-end: #ffedd5;
        
        --text-title-left: #1e3a8a;
        --text-sub-left: #475569;
        --grid-line: #cbd5e1;
        --grid-node: #64748b;
        --divider-line: #cbd5e1;
        
        --text-title-right: #c2410c;
        --text-sub-right: #9a3412;
        --text-quote: #334155;
      }

      /* Class helper styling */
      .bg-left-0 { stop-color: var(--bg-left-start); }
      .bg-left-100 { stop-color: var(--bg-left-end); }
      .bg-right-0 { stop-color: var(--bg-right-start); }
      .bg-right-100 { stop-color: var(--bg-right-end); }

      .text-title-left { fill: var(--text-title-left); }
      .text-sub-left { fill: var(--text-sub-left); }
      .grid-line { stroke: var(--grid-line); }
      .grid-node { fill: var(--grid-node); }
      .divider { stroke: var(--divider-line); }

      .text-title-right { fill: var(--text-title-right); }
      .text-sub-right { fill: var(--text-sub-right); }
      .text-quote { fill: var(--text-quote); }
      ]]>
    </style>

    <linearGradient id="bg-left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" class="bg-left-0"/>
      <stop offset="100%" class="bg-left-100"/>
    </linearGradient>
    <linearGradient id="bg-right" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" class="bg-right-0"/>
      <stop offset="100%" class="bg-right-100"/>
    </linearGradient>
    <radialGradient id="glow-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a9eff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4a9eff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-amber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9e4a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff9e4a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arrow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a9eff"/>
      <stop offset="100%" stop-color="#ff9e4a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-strong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background split (21:9 ultrawide ratio -> 2100x900) -->
  <rect x="0" y="0" width="1050" height="900" fill="url(#bg-left)"/>
  <rect x="1050" y="0" width="1050" height="900" fill="url(#bg-right)"/>

  <!-- Divider line -->
  <line x1="1050" y1="90" x2="1050" y2="810" class="divider" stroke-width="1" stroke-dasharray="8,8"/>

  <!-- LEFT SIDE: The Old World (Centered in Left Panel x: 0-1050 -> Center at x=525) -->
  <text x="525" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="37" font-weight="700" class="text-title-left" letter-spacing="2">THE OLD WORLD</text>
  <text x="525" y="120" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" class="text-sub-left">Human draws the map. System follows it.</text>

  <!-- Grid topology (Centered at x=525) -->
  <g transform="translate(405, 170)">
    <text x="120" y="-20" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" class="text-sub-left" font-weight="600">GRID COMPUTING</text>
    <!-- Grid lines -->
    <line x1="0" y1="0" x2="240" y2="0" class="grid-line" stroke-width="1"/>
    <line x1="0" y1="50" x2="240" y2="50" class="grid-line" stroke-width="1"/>
    <line x1="0" y1="100" x2="240" y2="100" class="grid-line" stroke-width="1"/>
    <line x1="0" y1="150" x2="240" y2="150" class="grid-line" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="150" class="grid-line" stroke-width="1"/>
    <line x1="60" y1="0" x2="60" y2="150" class="grid-line" stroke-width="1"/>
    <line x1="120" y1="0" x2="120" y2="150" class="grid-line" stroke-width="1"/>
    <line x1="180" y1="0" x2="180" y2="150" class="grid-line" stroke-width="1"/>
    <line x1="240" y1="0" x2="240" y2="150" class="grid-line" stroke-width="1"/>
    <!-- Nodes -->
    <circle cx="30" cy="25" r="7" class="grid-node" opacity="0.8"/>
    <circle cx="90" cy="25" r="7" class="grid-node" opacity="0.8"/>
    <circle cx="150" cy="25" r="7" class="grid-node" opacity="0.8"/>
    <circle cx="210" cy="25" r="7" class="grid-node" opacity="0.8"/>
    <circle cx="30" cy="75" r="7" class="grid-node" opacity="0.8"/>
    <circle cx="90" cy="75" r="7" class="grid-node" opacity="0.8"/>
    <circle cx="150" cy="75" r="7" class="grid-node" opacity="0.8"/>
    <circle cx="210" cy="75" r="7" class="grid-node" opacity="0.8"/>
    <circle cx="30" cy="125" r="7" class="grid-node" opacity="0.8"/>
    <circle cx="90" cy="125" r="7" class="grid-node" opacity="0.8"/>
    <circle cx="150" cy="125" r="7" class="grid-node" opacity="0.8"/>
    <circle cx="210" cy="125" r="7" class="grid-node" opacity="0.8"/>
  </g>

  <!-- Star topology (Centered at x=525) -->
  <g transform="translate(405, 400)">
    <text x="120" y="-20" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" class="text-sub-left" font-weight="600">MAPREDUCE</text>
    <circle cx="120" cy="75" r="12" fill="#4a9eff" filter="url(#glow)"/>
    <circle cx="30" cy="25" r="7" class="grid-node"/>
    <circle cx="210" cy="25" r="7" class="grid-node"/>
    <circle cx="30" cy="125" r="7" class="grid-node"/>
    <circle cx="210" cy="125" r="7" class="grid-node"/>
    <line x1="120" y1="75" x2="30" y2="25" stroke="#4a9eff" stroke-width="1.5" opacity="0.5"/>
    <line x1="120" y1="75" x2="210" y2="25" stroke="#4a9eff" stroke-width="1.5" opacity="0.5"/>
    <line x1="120" y1="75" x2="30" y2="125" stroke="#4a9eff" stroke-width="1.5" opacity="0.5"/>
    <line x1="120" y1="75" x2="210" y2="125" stroke="#4a9eff" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Circle/loop topology (Centered at x=525) -->
  <g transform="translate(405, 620)">
    <text x="120" y="-20" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" class="text-sub-left" font-weight="600">AGENT LOOP</text>
    <ellipse cx="120" cy="75" rx="85" ry="60" fill="none" stroke="#4a9eff" stroke-width="2" opacity="0.4" stroke-dasharray="6,4"/>
    <circle cx="120" cy="15" r="9" fill="#4a9eff" filter="url(#glow)"/>
    <circle cx="185" cy="55" r="7" class="grid-node"/>
    <circle cx="165" cy="120" r="7" class="grid-node"/>
    <circle cx="75" cy="120" r="7" class="grid-node"/>
    <circle cx="55" cy="55" r="7" class="grid-node"/>
    <path d="M 120 24 L 178 51" stroke="#4a9eff" stroke-width="1.5" opacity="0.5"/>
    <path d="M 178 61 L 163 112" stroke="#4a9eff" stroke-width="1.5" opacity="0.5"/>
    <path d="M 153 120 L 87 120" stroke="#4a9eff" stroke-width="1.5" opacity="0.5"/>
    <path d="M 67 112 L 60 63" stroke="#4a9eff" stroke-width="1.5" opacity="0.5"/>
    <path d="M 62 47 L 108 22" stroke="#4a9eff" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- RIGHT SIDE: The New World (Centered in Right Panel x: 1050-2100 -> Center at x=1575) -->
  <text x="1575" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="37" font-weight="700" class="text-title-right" letter-spacing="2">THE NEW WORLD</text>
  <text x="1575" y="120" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" class="text-sub-right">Model computes the map. Topology is the output.</text>

  <!-- Neural network / emergent topology (Centered at x=1575 -> translate x=1275) -->
  <g transform="translate(1275, 160)">
    <!-- Background glow -->
    <ellipse cx="300" cy="270" rx="260" ry="230" fill="url(#glow-amber)" opacity="0.6"/>

    <!-- Organic nodes -->
    <circle cx="160" cy="100" r="10" fill="#ff9e4a" filter="url(#glow-strong)"/>
    <circle cx="380" cy="70" r="9" fill="#ff7e2a" filter="url(#glow)"/>
    <circle cx="460" cy="180" r="11" fill="#ff9e4a" filter="url(#glow-strong)"/>
    <circle cx="410" cy="310" r="9" fill="#ff7e2a" filter="url(#glow)"/>
    <circle cx="240" cy="390" r="10" fill="#ff9e4a" filter="url(#glow-strong)"/>
    <circle cx="110" cy="280" r="9" fill="#ff7e2a" filter="url(#glow)"/>
    <circle cx="220" cy="200" r="13" fill="#ffbe6a" filter="url(#glow-strong)"/>
    <circle cx="330" cy="230" r="10" fill="#ff9e4a" filter="url(#glow)"/>
    <circle cx="300" cy="120" r="8" fill="#ff7e2a" filter="url(#glow)"/>
    <circle cx="140" cy="180" r="9" fill="#ff9e4a" filter="url(#glow)"/>
    <circle cx="430" cy="250" r="8" fill="#ffbe6a" filter="url(#glow)"/>
    <circle cx="180" cy="310" r="9" fill="#ff7e2a" filter="url(#glow)"/>

    <!-- Organic connections -->
    <path d="M 160 100 Q 250 70 380 70" stroke="#ff9e4a" stroke-width="1.8" fill="none" opacity="0.6" filter="url(#glow)"/>
    <path d="M 380 70 Q 440 120 460 180" stroke="#ff9e4a" stroke-width="1.8" fill="none" opacity="0.6" filter="url(#glow)"/>
    <path d="M 460 180 Q 450 250 410 310" stroke="#ff9e4a" stroke-width="1.8" fill="none" opacity="0.6" filter="url(#glow)"/>
    <path d="M 410 310 Q 330 350 240 390" stroke="#ff9e4a" stroke-width="1.8" fill="none" opacity="0.6" filter="url(#glow)"/>
    <path d="M 240 390 Q 170 340 110 280" stroke="#ff9e4a" stroke-width="1.8" fill="none" opacity="0.6" filter="url(#glow)"/>
    <path d="M 110 280 Q 120 200 140 180" stroke="#ff9e4a" stroke-width="1.8" fill="none" opacity="0.6" filter="url(#glow)"/>
    <path d="M 220 200 Q 180 140 160 100" stroke="#ffbe6a" stroke-width="2.2" fill="none" opacity="0.8" filter="url(#glow)"/>
    <path d="M 220 200 Q 270 160 300 120" stroke="#ffbe6a" stroke-width="2.2" fill="none" opacity="0.8" filter="url(#glow)"/>
    <path d="M 220 200 Q 280 210 330 230" stroke="#ffbe6a" stroke-width="2.2" fill="none" opacity="0.8" filter="url(#glow)"/>
    <path d="M 330 230 Q 380 200 380 70" stroke="#ff9e4a" stroke-width="1.8" fill="none" opacity="0.6" filter="url(#glow)"/>
    <path d="M 330 230 Q 380 260 430 250" stroke="#ff9e4a" stroke-width="1.8" fill="none" opacity="0.6" filter="url(#glow)"/>
    <path d="M 140 180 Q 180 190 220 200" stroke="#ff9e4a" stroke-width="1.8" fill="none" opacity="0.6" filter="url(#glow)"/>
    <path d="M 180 310 Q 200 250 220 200" stroke="#ff9e4a" stroke-width="1.8" fill="none" opacity="0.6" filter="url(#glow)"/>
    <path d="M 300 120 Q 310 170 330 230" stroke="#ff9e4a" stroke-width="1.8" fill="none" opacity="0.6" filter="url(#glow)"/>

    <!-- Central orchestrator glow -->
    <circle cx="270" cy="210" r="32" fill="url(#glow-amber)" opacity="0.8"/>
    <circle cx="270" cy="210" r="10" fill="#ffbe6a" filter="url(#glow-strong)"/>
  </g>

  <!-- Transition arrow (Centered at divider x=1050) -->
  <g transform="translate(1000, 430)">
    <path d="M 0 -35 L 100 0 L 0 35 Z" fill="url(#arrow-grad)" opacity="0.9" filter="url(#glow)"/>
    <text x="50" y="7" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#fff">AI</text>
  </g>

  <!-- Labels on right (Centered at x=1575) -->
  <g transform="translate(1355, 620)">
    <text x="220" y="0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="700" fill="#ffbe6a">KIMI AGENT SWARM</text>
    <text x="220" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" class="text-sub-right">Topology computed at runtime</text>
    <text x="220" y="66" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" class="text-sub-right">No blueprint. No menu. Just emergence.</text>
  </g>

  <!-- Bottom quote (Centered at x=1050) -->
  <text x="1050" y="850" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="600" class="text-quote" font-style="italic">&quot;The state machine stopped being a graph.&quot;</text>
</svg>