<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2100 740" width="2100" height="740">
  <defs>
    <style>
      <![CDATA[
      /* Default / Dark Theme Colors */
      :root {
        --bg-left-start: #0a0e1a;
        --bg-left-end: #1a1f3a;
        --bg-right-start: #1a0a1a;
        --bg-right-end: #3a1528;
        
        --text-title-left: #8aa4c8;
        --text-sub-left: #5a7090;
        --grid-line: #2a3a5a;
        --grid-node: #4a6a9a;
        --divider-line: #333333;
        
        --text-title-right: #ff9e4a;
        --text-sub-right: #b08060;
        --text-swarm-title: #ffbe6a;

        --right-node-primary: #ff9e4a;
        --right-node-secondary: #ff7e2a;
        --right-node-highlight: #ffbe6a;
        --right-connection-primary: #ff9e4a;
        --right-connection-highlight: #ffbe6a;
        --right-glow-opacity: 0.6;
      }

      /* MUI Light Mode and prefers-color-scheme: light */
      @media (prefers-color-scheme: light) {
        :root {
          --bg-left-start: #f1f5f9;
          --bg-left-end: #e2e8f0;
          --bg-right-start: #fff7ed;
          --bg-right-end: #ffedd5;
          
          --text-title-left: #1e3a8a;
          --text-sub-left: #475569;
          --grid-line: #cbd5e1;
          --grid-node: #475569;
          --divider-line: #cbd5e1;
          
          --text-title-right: #ea580c;
          --text-sub-right: #9a3412;
          --text-swarm-title: #c2410c;

          --right-node-primary: #ea580c;
          --right-node-secondary: #c2410c;
          --right-node-highlight: #9a3412;
          --right-connection-primary: #ea580c;
          --right-connection-highlight: #c2410c;
          --right-glow-opacity: 0.25;
        }
      }

      /* Explicit MUI Light Mode Selectors */
      [data-mui-color-scheme="light"] svg,
      .mui-mode-light svg,
      html[data-theme="light"] svg,
      body.light-mode svg {
        --bg-left-start: #f1f5f9;
        --bg-left-end: #e2e8f0;
        --bg-right-start: #fff7ed;
        --bg-right-end: #ffedd5;
        
        --text-title-left: #1e3a8a;
        --text-sub-left: #475569;
        --grid-line: #cbd5e1;
        --grid-node: #475569;
        --divider-line: #cbd5e1;
        
        --text-title-right: #ea580c;
        --text-sub-right: #9a3412;
        --text-swarm-title: #c2410c;

        --right-node-primary: #ea580c;
        --right-node-secondary: #c2410c;
        --right-node-highlight: #9a3412;
        --right-connection-primary: #ea580c;
        --right-connection-highlight: #c2410c;
        --right-glow-opacity: 0.25;
      }

      /* Class helper styling */
      .bg-left-0 { stop-color: var(--bg-left-start); }
      .bg-left-100 { stop-color: var(--bg-left-end); }
      .bg-right-0 { stop-color: var(--bg-right-start); }
      .bg-right-100 { stop-color: var(--bg-right-end); }

      .text-title-left { fill: var(--text-title-left); }
      .text-sub-left { fill: var(--text-sub-left); }
      .grid-line { stroke: var(--grid-line); }
      .grid-node { fill: var(--grid-node); }
      .divider { stroke: var(--divider-line); }

      .text-title-right { fill: var(--text-title-right); }
      .text-sub-right { fill: var(--text-sub-right); }
      .text-swarm-title { fill: var(--text-swarm-title); }

      .right-node-p { fill: var(--right-node-primary); }
      .right-node-s { fill: var(--right-node-secondary); }
      .right-node-h { fill: var(--right-node-highlight); }
      .right-conn-p { stroke: var(--right-connection-primary); }
      .right-conn-h { stroke: var(--right-connection-highlight); }
      .right-bg-glow { opacity: var(--right-glow-opacity); }
      ]]>
    </style>

    <linearGradient id="bg-left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" class="bg-left-0"/>
      <stop offset="100%" class="bg-left-100"/>
    </linearGradient>
    <linearGradient id="bg-right" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" class="bg-right-0"/>
      <stop offset="100%" class="bg-right-100"/>
    </linearGradient>
    <radialGradient id="glow-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a9eff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4a9eff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-amber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9e4a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff9e4a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arrow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a9eff"/>
      <stop offset="100%" stop-color="#ff9e4a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-strong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background split (21:9 ultrawide ratio cropped to 2100x740) -->
  <rect x="0" y="0" width="1050" height="740" fill="url(#bg-left)"/>
  <rect x="1050" y="0" width="1050" height="740" fill="url(#bg-right)"/>

  <!-- Divider line -->
  <line x1="1050" y1="70" x2="1050" y2="710" class="divider" stroke-width="1" stroke-dasharray="8,8"/>

  <!-- LEFT SIDE: Main Header -->
  <text x="525" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" class="text-title-left" letter-spacing="2">THE OLD WORLD</text>
  <text x="525" y="118" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="34" class="text-sub-left">Human draws the map. System follows it.</text>

  <!-- LEFT SIDE: 3 Topologies Arranged Horizontally across Left Side (Centers: x=195, x=525, x=855) -->

  <!-- 1. Grid topology (Left: x=195 -> translate x=85, y=340) -->
  <g transform="translate(85, 340)">
    <text x="110" y="-30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" class="text-sub-left" font-weight="600">GRID COMPUTING</text>
    <!-- Grid lines -->
    <line x1="0" y1="0" x2="220" y2="0" class="grid-line" stroke-width="1"/>
    <line x1="0" y1="55" x2="220" y2="55" class="grid-line" stroke-width="1"/>
    <line x1="0" y1="110" x2="220" y2="110" class="grid-line" stroke-width="1"/>
    <line x1="0" y1="165" x2="220" y2="165" class="grid-line" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="165" class="grid-line" stroke-width="1"/>
    <line x1="55" y1="0" x2="55" y2="165" class="grid-line" stroke-width="1"/>
    <line x1="110" y1="0" x2="110" y2="165" class="grid-line" stroke-width="1"/>
    <line x1="165" y1="0" x2="165" y2="165" class="grid-line" stroke-width="1"/>
    <line x1="220" y1="0" x2="220" y2="165" class="grid-line" stroke-width="1"/>
    <!-- Nodes -->
    <circle cx="27.5" cy="27.5" r="7" class="grid-node" opacity="0.8"/>
    <circle cx="82.5" cy="27.5" r="7" class="grid-node" opacity="0.8"/>
    <circle cx="137.5" cy="27.5" r="7" class="grid-node" opacity="0.8"/>
    <circle cx="192.5" cy="27.5" r="7" class="grid-node" opacity="0.8"/>
    <circle cx="27.5" cy="82.5" r="7" class="grid-node" opacity="0.8"/>
    <circle cx="82.5" cy="82.5" r="7" class="grid-node" opacity="0.8"/>
    <circle cx="137.5" cy="82.5" r="7" class="grid-node" opacity="0.8"/>
    <circle cx="192.5" cy="82.5" r="7" class="grid-node" opacity="0.8"/>
    <circle cx="27.5" cy="137.5" r="7" class="grid-node" opacity="0.8"/>
    <circle cx="82.5" cy="137.5" r="7" class="grid-node" opacity="0.8"/>
    <circle cx="137.5" cy="137.5" r="7" class="grid-node" opacity="0.8"/>
    <circle cx="192.5" cy="137.5" r="7" class="grid-node" opacity="0.8"/>
  </g>

  <!-- 2. Star topology (Center: x=525 -> translate x=415, y=340) -->
  <g transform="translate(415, 340)">
    <text x="110" y="-30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" class="text-sub-left" font-weight="600">MAPREDUCE</text>
    <circle cx="110" cy="82.5" r="14" fill="#4a9eff" filter="url(#glow)"/>
    <circle cx="27.5" cy="27.5" r="7" class="grid-node"/>
    <circle cx="192.5" cy="27.5" r="7" class="grid-node"/>
    <circle cx="27.5" cy="137.5" r="7" class="grid-node"/>
    <circle cx="192.5" cy="137.5" r="7" class="grid-node"/>
    <line x1="110" y1="82.5" x2="27.5" y2="27.5" stroke="#4a9eff" stroke-width="1.8" opacity="0.6"/>
    <line x1="110" y1="82.5" x2="192.5" y2="27.5" stroke="#4a9eff" stroke-width="1.8" opacity="0.6"/>
    <line x1="110" y1="82.5" x2="27.5" y2="137.5" stroke="#4a9eff" stroke-width="1.8" opacity="0.6"/>
    <line x1="110" y1="82.5" x2="192.5" y2="137.5" stroke="#4a9eff" stroke-width="1.8" opacity="0.6"/>
  </g>

  <!-- 3. Circle/loop topology (Right of Left Panel: x=855 -> translate x=745, y=340) -->
  <g transform="translate(745, 340)">
    <text x="110" y="-30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" class="text-sub-left" font-weight="600">AGENT LOOP</text>
    <ellipse cx="110" cy="82.5" rx="80" ry="60" fill="none" stroke="#4a9eff" stroke-width="2" opacity="0.4" stroke-dasharray="6,4"/>
    <circle cx="110" cy="22.5" r="9" fill="#4a9eff" filter="url(#glow)"/>
    <circle cx="175" cy="62.5" r="7" class="grid-node"/>
    <circle cx="155" cy="127.5" r="7" class="grid-node"/>
    <circle cx="65" cy="127.5" r="7" class="grid-node"/>
    <circle cx="45" cy="62.5" r="7" class="grid-node"/>
    <path d="M 110 31.5 L 168 58.5" stroke="#4a9eff" stroke-width="1.8" opacity="0.6"/>
    <path d="M 168 68.5 L 153 119.5" stroke="#4a9eff" stroke-width="1.8" opacity="0.6"/>
    <path d="M 143 127.5 L 77 127.5" stroke="#4a9eff" stroke-width="1.8" opacity="0.6"/>
    <path d="M 57 119.5 L 50 70.5" stroke="#4a9eff" stroke-width="1.8" opacity="0.6"/>
    <path d="M 52 54.5 L 98 29.5" stroke="#4a9eff" stroke-width="1.8" opacity="0.6"/>
  </g>

  <!-- RIGHT SIDE: Main Header -->
  <text x="1575" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" class="text-title-right" letter-spacing="2">THE NEW WORLD</text>
  <text x="1575" y="118" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="34" class="text-sub-right">Model computes the map. Topology is the output.</text>

  <!-- Neural network / emergent topology (Centered at x=1575 -> translate x=1275) -->
  <g transform="translate(1275, 150)">
    <!-- Background glow -->
    <ellipse cx="300" cy="270" rx="260" ry="230" fill="url(#glow-amber)" class="right-bg-glow"/>

    <!-- Organic nodes -->
    <circle cx="160" cy="100" r="10" class="right-node-p" filter="url(#glow-strong)"/>
    <circle cx="380" cy="70" r="9" class="right-node-s" filter="url(#glow)"/>
    <circle cx="460" cy="180" r="11" class="right-node-p" filter="url(#glow-strong)"/>
    <circle cx="410" cy="310" r="9" class="right-node-s" filter="url(#glow)"/>
    <circle cx="240" cy="390" r="10" class="right-node-p" filter="url(#glow-strong)"/>
    <circle cx="110" cy="280" r="9" class="right-node-s" filter="url(#glow)"/>
    <circle cx="220" cy="200" r="13" class="right-node-h" filter="url(#glow-strong)"/>
    <circle cx="330" cy="230" r="10" class="right-node-p" filter="url(#glow)"/>
    <circle cx="300" cy="120" r="8" class="right-node-s" filter="url(#glow)"/>
    <circle cx="140" cy="180" r="9" class="right-node-p" filter="url(#glow)"/>
    <circle cx="430" cy="250" r="8" class="right-node-h" filter="url(#glow)"/>
    <circle cx="180" cy="310" r="9" class="right-node-s" filter="url(#glow)"/>

    <!-- Organic connections -->
    <path d="M 160 100 Q 250 70 380 70" class="right-conn-p" stroke-width="2.2" fill="none" opacity="0.8" filter="url(#glow)"/>
    <path d="M 380 70 Q 440 120 460 180" class="right-conn-p" stroke-width="2.2" fill="none" opacity="0.8" filter="url(#glow)"/>
    <path d="M 460 180 Q 450 250 410 310" class="right-conn-p" stroke-width="2.2" fill="none" opacity="0.8" filter="url(#glow)"/>
    <path d="M 410 310 Q 330 350 240 390" class="right-conn-p" stroke-width="2.2" fill="none" opacity="0.8" filter="url(#glow)"/>
    <path d="M 240 390 Q 170 340 110 280" class="right-conn-p" stroke-width="2.2" fill="none" opacity="0.8" filter="url(#glow)"/>
    <path d="M 110 280 Q 120 200 140 180" class="right-conn-p" stroke-width="2.2" fill="none" opacity="0.8" filter="url(#glow)"/>
    <path d="M 220 200 Q 180 140 160 100" class="right-conn-h" stroke-width="2.8" fill="none" opacity="0.9" filter="url(#glow)"/>
    <path d="M 220 200 Q 270 160 300 120" class="right-conn-h" stroke-width="2.8" fill="none" opacity="0.9" filter="url(#glow)"/>
    <path d="M 220 200 Q 280 210 330 230" class="right-conn-h" stroke-width="2.8" fill="none" opacity="0.9" filter="url(#glow)"/>
    <path d="M 330 230 Q 380 200 380 70" class="right-conn-p" stroke-width="2.2" fill="none" opacity="0.8" filter="url(#glow)"/>
    <path d="M 330 230 Q 380 260 430 250" class="right-conn-p" stroke-width="2.2" fill="none" opacity="0.8" filter="url(#glow)"/>
    <path d="M 140 180 Q 180 190 220 200" class="right-conn-p" stroke-width="2.2" fill="none" opacity="0.8" filter="url(#glow)"/>
    <path d="M 180 310 Q 200 250 220 200" class="right-conn-p" stroke-width="2.2" fill="none" opacity="0.8" filter="url(#glow)"/>
    <path d="M 300 120 Q 310 170 330 230" class="right-conn-p" stroke-width="2.2" fill="none" opacity="0.8" filter="url(#glow)"/>

    <!-- Central orchestrator glow -->
    <circle cx="270" cy="210" r="32" fill="url(#glow-amber)" class="right-bg-glow"/>
    <circle cx="270" cy="210" r="10" class="right-node-h" filter="url(#glow-strong)"/>
  </g>

  <!-- Transition arrow (Centered at divider x=1050) -->
  <g transform="translate(975, 410)">
    <path d="M 0 -52.5 L 150 0 L 0 52.5 Z" fill="url(#arrow-grad)" opacity="0.9" filter="url(#glow)"/>
    <!-- AI text shifted left inside the triangle: x=40 -->
    <text x="40" y="14" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="45" font-weight="700" fill="#fff">AI</text>
  </g>

  <!-- Labels on right (Centered at x=1575) -->
  <g transform="translate(1355, 600)">
    <text x="220" y="0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" class="text-swarm-title">KIMI AGENT SWARM</text>
    <text x="220" y="48" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="33" class="text-sub-right">Topology computed at runtime</text>
    <text x="220" y="90" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="33" class="text-sub-right">No blueprint. No menu. Just emergence.</text>
  </g>
</svg>