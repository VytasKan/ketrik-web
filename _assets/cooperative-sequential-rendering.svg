<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 855" width="1400" height="855" role="img" aria-label="Diagram comparing cold load, warm unmodified rendering, and warm rendering with a cooperative sequential render queue">
  <defs>
    <style>
      <![CDATA[
      /* Default / Dark Theme Colors */
      :root {
        --bg-main: #0b0f19;
        --title-color: #f8fafc;
        --subtitle-color: #cbd5e1;
        --lane-color: #f8fafc;
        --sub-color: #cbd5e1;
        --small-color: #e2e8f0;
        --tiny-color: #94a3b8;
        --axis-color: #64748b;

        --card-bg-a: #1e293b;
        --card-border-a: #334155;
        
        --card-bg-b: #0f172a;
        --card-border-b: #1e293b;

        --card-bg-queue: #022c22;
        --card-border-queue: #047857;

        --skeleton-bg: #334155;
        --skeleton-border: #475569;
        --skeleton-text: #f1f5f9;

        --render-bg: #7c2d12;
        --render-border: #ea580c;
        --render-inner-bg: #9a3412;
        --render-text: #ffedd5;

        --painted-bg: #047857;
        --painted-border: #10b981;
        --painted-text: #ffffff;

        --cache-bg: #1e3a8a;
        --cache-border: #3b82f6;
        --cache-text: #bfdbfe;

        --queue-info-bg: #064e3b;
        --queue-info-border: #10b981;

        --hatch-bg: #1e293b;
        --hatch-line: #475569;

        --commit-line: #10b981;
      }

      /* MUI Light Mode and prefers-color-scheme: light */
      @media (prefers-color-scheme: light) {
        :root {
          --bg-main: #ffffff;
          --title-color: #0f172a;
          --subtitle-color: #475569;
          --lane-color: #0f172a;
          --sub-color: #334155;
          --small-color: #1e293b;
          --tiny-color: #475569;
          --axis-color: #64748b;

          --card-bg-a: #f8fafc;
          --card-border-a: #cbd5e1;

          --card-bg-b: #ffffff;
          --card-border-b: #cbd5e1;

          --card-bg-queue: #f0fdf4;
          --card-border-queue: #86efac;

          --skeleton-bg: #e2e8f0;
          --skeleton-border: #94a3b8;
          --skeleton-text: #1e293b;

          --render-bg: #fff7ed;
          --render-border: #ea580c;
          --render-inner-bg: #fed7aa;
          --render-text: #7c2d12;

          --painted-bg: #bbf7d0;
          --painted-border: #16a34a;
          --painted-text: #064e3b;

          --cache-bg: #dbeafe;
          --cache-border: #2563eb;
          --cache-text: #1e3a8a;

          --queue-info-bg: #ffffff;
          --queue-info-border: #4ade80;

          --hatch-bg: #f8fafc;
          --hatch-line: #cbd5e1;

          --commit-line: #16a34a;
        }
      }

      /* Explicit MUI Light Mode Selectors */
      [data-mui-color-scheme="light"] svg,
      .mui-mode-light svg,
      html[data-theme="light"] svg,
      body.light-mode svg,
      svg.light-theme {
        --bg-main: #ffffff;
        --title-color: #0f172a;
        --subtitle-color: #475569;
        --lane-color: #0f172a;
        --sub-color: #334155;
        --small-color: #1e293b;
        --tiny-color: #475569;
        --axis-color: #64748b;

        --card-bg-a: #f8fafc;
        --card-border-a: #cbd5e1;

        --card-bg-b: #ffffff;
        --card-border-b: #cbd5e1;

        --card-bg-queue: #f0fdf4;
        --card-border-queue: #86efac;

        --skeleton-bg: #e2e8f0;
        --skeleton-border: #94a3b8;
        --skeleton-text: #1e293b;

        --render-bg: #fff7ed;
        --render-border: #ea580c;
        --render-inner-bg: #fed7aa;
        --render-text: #7c2d12;

        --painted-bg: #bbf7d0;
        --painted-border: #16a34a;
        --painted-text: #064e3b;

        --cache-bg: #dbeafe;
        --cache-border: #2563eb;
        --cache-text: #1e3a8a;

        --queue-info-bg: #ffffff;
        --queue-info-border: #4ade80;

        --hatch-bg: #f8fafc;
        --hatch-line: #cbd5e1;

        --commit-line: #16a34a;
      }

      /* Explicit MUI Dark Mode Selectors */
      [data-mui-color-scheme="dark"] svg,
      .mui-mode-dark svg,
      html[data-theme="dark"] svg,
      body.dark-mode svg,
      svg.dark-theme {
        --bg-main: #0b0f19;
        --title-color: #f8fafc;
        --subtitle-color: #cbd5e1;
        --lane-color: #f8fafc;
        --sub-color: #cbd5e1;
        --small-color: #e2e8f0;
        --tiny-color: #94a3b8;
        --axis-color: #64748b;

        --card-bg-a: #1e293b;
        --card-border-a: #334155;

        --card-bg-b: #0f172a;
        --card-border-b: #1e293b;

        --card-bg-queue: #022c22;
        --card-border-queue: #047857;

        --skeleton-bg: #334155;
        --skeleton-border: #475569;
        --skeleton-text: #f1f5f9;

        --render-bg: #7c2d12;
        --render-border: #ea580c;
        --render-inner-bg: #9a3412;
        --render-text: #ffedd5;

        --painted-bg: #047857;
        --painted-border: #10b981;
        --painted-text: #ffffff;

        --cache-bg: #1e3a8a;
        --cache-border: #3b82f6;
        --cache-text: #bfdbfe;

        --queue-info-bg: #064e3b;
        --queue-info-border: #10b981;

        --hatch-bg: #1e293b;
        --hatch-line: #475569;

        --commit-line: #10b981;
      }

      text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .title {
        font-size: 39px;
        font-weight: 700;
        fill: var(--title-color);
      }

      .subtitle {
        font-size: 22px;
        fill: var(--subtitle-color);
      }

      .lane {
        font-size: 26px;
        font-weight: 600;
        fill: var(--lane-color);
      }

      .sub {
        font-size: 20px;
        fill: var(--sub-color);
      }

      .small {
        font-size: 22px;
        fill: var(--small-color);
      }

      .tiny {
        font-size: 20px;
        fill: var(--tiny-color);
      }

      .axis {
        stroke: var(--axis-color);
        stroke-width: 2.5;
      }
      ]]>
    </style>

    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="var(--hatch-bg)"></rect>
      <line x1="0" y1="0" x2="0" y2="8" stroke="var(--hatch-line)" stroke-width="2.5"></line>
    </pattern>

    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 z" fill="var(--axis-color)"></path>
    </marker>
  </defs>

  <rect width="1400" height="855" fill="var(--bg-main)"></rect>

  <text x="700" y="44" text-anchor="middle" class="title">
    Cooperative Sequential Rendering
  </text>

  <text x="700" y="76" text-anchor="middle" class="subtitle">
    Cold load gets staggered reveal from async imports; warm navigation needs a queue to recover it.
  </text>

  <!-- Legend -->
  <g transform="translate(680, 92)">
    <rect x="0" y="0" width="22" height="22" rx="4" fill="var(--skeleton-bg)" stroke="var(--skeleton-border)"></rect>
    <text x="30" y="17" class="small">Skeleton / fallback</text>

    <rect x="210" y="0" width="22" height="22" rx="4" fill="var(--render-bg)" stroke="var(--render-border)"></rect>
    <text x="240" y="17" class="small">Render work</text>

    <rect x="380" y="0" width="22" height="22" rx="4" fill="var(--painted-bg)" stroke="var(--painted-border)"></rect>
    <text x="410" y="17" class="small">Painted content</text>

    <rect x="570" y="0" width="22" height="22" rx="4" fill="url(#hatch)" stroke="var(--skeleton-border)"></rect>
    <text x="600" y="17" class="small">Frame gap</text>
  </g>

  <!-- Path A: Cold load -->
  <g>
    <rect x="20" y="135" width="1360" height="200" rx="16" fill="var(--card-bg-a)" stroke="var(--card-border-a)"></rect>

    <text x="42" y="200" class="lane">Path A</text>
    <text x="42" y="228" class="sub">Cold load</text>
    <text x="42" y="248" class="tiny">async imports</text>
    <text x="42" y="268" class="tiny">create incidental</text>
    <text x="42" y="288" class="tiny">stagger</text>

    <line x1="220" y1="245" x2="1340" y2="245" class="axis" marker-end="url(#arrow)"></line>
    <text x="220" y="295" text-anchor="middle" class="tiny">mount</text>

    <rect x="240" y="215" width="230" height="60" rx="10" fill="var(--skeleton-bg)" stroke="var(--skeleton-border)"></rect>
    <text x="355" y="240" text-anchor="middle" class="small" font-weight="600" fill="var(--skeleton-text)">Suspense fallback</text>
    <text x="355" y="260" text-anchor="middle" class="tiny">skeletons</text>

    <text x="850" y="172" text-anchor="middle" class="tiny">
      imports resolve at different times
    </text>

    <line x1="540" y1="180" x2="540" y2="212" stroke="var(--skeleton-border)" stroke-dasharray="6 5" marker-end="url(#arrow)"></line>
    <line x1="760" y1="180" x2="760" y2="212" stroke="var(--skeleton-border)" stroke-dasharray="6 5" marker-end="url(#arrow)"></line>
    <line x1="980" y1="180" x2="980" y2="212" stroke="var(--skeleton-border)" stroke-dasharray="6 5" marker-end="url(#arrow)"></line>
    <line x1="1200" y1="180" x2="1200" y2="212" stroke="var(--skeleton-border)" stroke-dasharray="6 5" marker-end="url(#arrow)"></line>

    <rect x="490" y="215" width="100" height="60" rx="10" fill="var(--painted-bg)" stroke="var(--painted-border)"></rect>
    <text x="540" y="252" text-anchor="middle" class="small" font-weight="700" fill="var(--painted-text)">C0</text>

    <rect x="710" y="215" width="100" height="60" rx="10" fill="var(--painted-bg)" stroke="var(--painted-border)"></rect>
    <text x="760" y="252" text-anchor="middle" class="small" font-weight="700" fill="var(--painted-text)">C1</text>

    <rect x="930" y="215" width="100" height="60" rx="10" fill="var(--painted-bg)" stroke="var(--painted-border)"></rect>
    <text x="980" y="252" text-anchor="middle" class="small" font-weight="700" fill="var(--painted-text)">C2</text>

    <rect x="1150" y="215" width="100" height="60" rx="10" fill="var(--painted-bg)" stroke="var(--painted-border)"></rect>
    <text x="1200" y="252" text-anchor="middle" class="small" font-weight="700" fill="var(--painted-text)">C3</text>

    <line x1="590" y1="205" x2="590" y2="285" stroke="var(--commit-line)" stroke-width="3.5"></line>
    <line x1="810" y1="205" x2="810" y2="285" stroke="var(--commit-line)" stroke-width="3.5"></line>
    <line x1="1030" y1="205" x2="1030" y2="285" stroke="var(--commit-line)" stroke-width="3.5"></line>
    <line x1="1250" y1="205" x2="1250" y2="285" stroke="var(--commit-line)" stroke-width="3.5"></line>

    <text x="240" y="318" class="small">
      Progressive reveal is accidental: it comes from real network/parse latency.
    </text>
  </g>

  <!-- Path B: Warm unmodified -->
  <g>
    <rect x="20" y="355" width="1360" height="190" rx="16" fill="var(--card-bg-b)" stroke="var(--card-border-b)"></rect>

    <text x="42" y="420" class="lane">Path B</text>
    <text x="42" y="445" class="sub">Warm navigation,</text>
    <text x="42" y="468" class="sub">unmodified</text>
    <text x="42" y="492" class="tiny">all modules</text>
    <text x="42" y="510" class="tiny">already cached</text>

    <line x1="220" y1="455" x2="1340" y2="455" class="axis" marker-end="url(#arrow)"></line>
    <text x="220" y="500" text-anchor="middle" class="tiny">mount</text>

    <rect x="250" y="425" width="220" height="60" rx="10" fill="var(--cache-bg)" stroke="var(--cache-border)"></rect>
    <text x="360" y="450" text-anchor="middle" class="small" font-weight="600" fill="var(--cache-text)">module cache hit</text>
    <text x="360" y="468" text-anchor="middle" class="tiny">no pending promise</text>

    <rect x="490" y="425" width="600" height="60" rx="10" fill="var(--render-bg)" stroke="var(--render-border)"></rect>

    <text x="790" y="410" text-anchor="middle" class="small" font-weight="600">
      Synchronous render: N component calls + N data-shaping steps
    </text>

    <rect x="495" y="430" width="142" height="50" rx="8" fill="var(--render-inner-bg)" stroke="var(--render-border)"></rect>
    <text x="566" y="462" text-anchor="middle" class="small" font-weight="700" fill="var(--render-text)">C0</text>

    <rect x="642" y="430" width="142" height="50" rx="8" fill="var(--render-inner-bg)" stroke="var(--render-border)"></rect>
    <text x="713" y="462" text-anchor="middle" class="small" font-weight="700" fill="var(--render-text)">C1</text>

    <rect x="789" y="430" width="142" height="50" rx="8" fill="var(--render-inner-bg)" stroke="var(--render-border)"></rect>
    <text x="860" y="462" text-anchor="middle" class="small" font-weight="700" fill="var(--render-text)">C2</text>

    <rect x="936" y="430" width="142" height="50" rx="8" fill="var(--render-inner-bg)" stroke="var(--render-border)"></rect>
    <text x="1007" y="462" text-anchor="middle" class="small" font-weight="700" fill="var(--render-text)">C3</text>

    <rect x="1120" y="425" width="190" height="60" rx="10" fill="var(--painted-bg)" stroke="var(--painted-border)"></rect>
    <text x="1215" y="450" text-anchor="middle" class="small" font-weight="700" fill="var(--painted-text)">all cards</text>
    <text x="1215" y="470" text-anchor="middle" class="small" font-weight="700" fill="var(--painted-text)">paint together</text>

    <line x1="1100" y1="415" x2="1100" y2="495" stroke="var(--commit-line)" stroke-width="3.5"></line>

    <text x="240" y="534" class="small">
      Warm navigation loses staggered reveal because nothing suspends and everything commits in one pass.
    </text>
  </g>

  <!-- Path B + queue -->
  <g>
    <rect x="20" y="565" width="1360" height="270" rx="16" fill="var(--card-bg-queue)" stroke="var(--card-border-queue)"></rect>

    <text x="42" y="635" class="lane">Path B + queue</text>
    <text x="42" y="662" class="sub">Warm navigation,</text>
    <text x="42" y="685" class="sub">cooperative queue</text>
    <text x="42" y="708" class="tiny">effect order drives</text>
    <text x="42" y="726" class="tiny">queue order</text>

    <line x1="220" y1="700" x2="1340" y2="700" class="axis" marker-end="url(#arrow)"></line>
    <text x="220" y="745" text-anchor="middle" class="tiny">mount</text>

    <rect x="240" y="590" width="670" height="62" rx="10" fill="var(--queue-info-bg)" stroke="var(--queue-info-border)"></rect>
    <text x="256" y="615" class="small" font-weight="600">
      useEffect mount order: C0 → C1 → C2 → C3
    </text>
    <text x="256" y="638" class="tiny">
      tasks are token-cancelled on unmount
    </text>

    <rect x="240" y="670" width="230" height="60" rx="10" fill="var(--skeleton-bg)" stroke="var(--skeleton-border)"></rect>
    <text x="355" y="695" text-anchor="middle" class="small" font-weight="600" fill="var(--skeleton-text)">skeletons commit</text>
    <text x="355" y="715" text-anchor="middle" class="tiny">immediate shell</text>

    <rect x="480" y="670" width="95" height="60" rx="10" fill="var(--painted-bg)" stroke="var(--painted-border)"></rect>
    <text x="527" y="706" text-anchor="middle" class="small" font-weight="700" fill="var(--painted-text)">C0</text>
    <line x1="575" y1="660" x2="575" y2="740" stroke="var(--commit-line)" stroke-width="3.5"></line>

    <rect x="585" y="670" width="60" height="60" rx="10" fill="url(#hatch)" stroke="var(--skeleton-border)"></rect>
    <text x="615" y="758" text-anchor="middle" class="tiny">2 rAF</text>

    <rect x="655" y="670" width="95" height="60" rx="10" fill="var(--painted-bg)" stroke="var(--painted-border)"></rect>
    <text x="702" y="706" text-anchor="middle" class="small" font-weight="700" fill="var(--painted-text)">C1</text>
    <line x1="750" y1="660" x2="750" y2="740" stroke="var(--commit-line)" stroke-width="3.5"></line>

    <rect x="760" y="670" width="60" height="60" rx="10" fill="url(#hatch)" stroke="var(--skeleton-border)"></rect>
    <text x="790" y="758" text-anchor="middle" class="tiny">2 rAF</text>

    <rect x="830" y="670" width="95" height="60" rx="10" fill="var(--painted-bg)" stroke="var(--painted-border)"></rect>
    <text x="877" y="706" text-anchor="middle" class="small" font-weight="700" fill="var(--painted-text)">C2</text>
    <line x1="925" y1="660" x2="925" y2="740" stroke="var(--commit-line)" stroke-width="3.5"></line>

    <rect x="935" y="670" width="60" height="60" rx="10" fill="url(#hatch)" stroke="var(--skeleton-border)"></rect>
    <text x="965" y="758" text-anchor="middle" class="tiny">2 rAF</text>

    <rect x="1005" y="670" width="95" height="60" rx="10" fill="var(--painted-bg)" stroke="var(--painted-border)"></rect>
    <text x="1052" y="706" text-anchor="middle" class="small" font-weight="700" fill="var(--painted-text)">C3</text>
    <line x1="1100" y1="660" x2="1100" y2="740" stroke="var(--commit-line)" stroke-width="3.5"></line>

    <text x="240" y="805" class="small">
      Warm navigation with cooperative queue yields between tasks, restoring progressive reveal (C0 → C1 → C2 → C3).
    </text>
  </g>
</svg>